name: Sync official schedule

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check posts without changing schedule.js
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-official-schedule
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      META_APP_ACCESS_TOKEN: ${{ secrets.META_APP_ACCESS_TOKEN }}
      META_PAGE_ID: "102920706051241"
      META_GRAPH_VERSION: "v26.0"
      SYNC_LOOKBACK_HOURS: "48"
      GITHUB_TOKEN: ${{ github.token }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test schedule parser
        run: node --test scripts/sync-official-schedule.test.mjs

      - name: Check cloud credentials
        id: credentials
        run: |
          if [ -z "$META_APP_ACCESS_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "### 尚未啟用" >> "$GITHUB_STEP_SUMMARY"
            echo "缺少 META_APP_ACCESS_TOKEN；略過官方貼文同步。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check official Facebook posts
        if: steps.credentials.outputs.enabled == 'true'
        run: node scripts/sync-official-schedule.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Detect confirmed schedule updates
        if: steps.credentials.outputs.enabled == 'true' && !inputs.dry_run
        id: changes
        run: |
          if git diff --quiet -- schedule.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit confirmed schedule updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "lad-schedule-bot"
          git config user.email "lad-schedule-bot@users.noreply.github.com"
          git add schedule.js
          git commit -m "Update confirmed official schedule"
          git push origin main

      - name: Pull Vercel production settings
        if: steps.changes.outputs.changed == 'true'
        run: npx --yes vercel@59.5.0 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build for Vercel
        if: steps.changes.outputs.changed == 'true'
        run: npx --yes vercel@59.5.0 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel Production
        if: steps.changes.outputs.changed == 'true'
        run: npx --yes vercel@59.5.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
